<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #09090b; color: #a1a1aa; font: 14px system-ui, sans-serif; }
      main { height: 100%; display: grid; place-items: center; text-align: center; }
      code { background: #18181b; padding: 2px 6px; border-radius: 4px; color: #e4e4e7; }
      a { color: #38bdf8; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <!-- Shown only if the dashboard server is not running. -->
    <main id="offline" hidden>
      <div>
        <h1 style="color:#e4e4e7;font-size:18px">Office Dashboard isn't running</h1>
        <p>Start it with <code>npm start</code> in the project folder, then <a id="retry" href="#">retry</a>.</p>
      </div>
    </main>
    <script src="newtab.js"></script>
  </body>
</html>
